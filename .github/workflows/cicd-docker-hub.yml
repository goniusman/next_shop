name: Blue-Green Deployment

on:
  push:
    branches:
      - Hold

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build & push images
      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker compose -f docker-compose.production.yml build --no-cache
          docker tag admin_bazar:${IMAGE_TAG:-local} myregistry/admin_bazar:${IMAGE_TAG}
          docker push myregistry/admin_bazar:${IMAGE_TAG}

      # 4️⃣ SSH to server and deploy
      - name: Deploy to production
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/admin_bazar
            IMAGE_TAG=${GITHUB_SHA::7}

            # Pull new image
            docker pull myregistry/admin_bazar:${IMAGE_TAG}

            # Blue-Green Deployment Script
            bash ./deploy.sh $IMAGE_TAG
